name: TAXIO Alert Companion Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alert-companion-runtime-smoke.yml'

permissions:
  contents: read
  actions: read

jobs:
  android-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download latest successful pilot APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/taxio-apk
          gh run download 44548110386 -n taxio-alert-companion-pilot-apk -D /tmp/taxio-apk
          find /tmp/taxio-apk -type f -maxdepth 2 -ls
          APK=$(find /tmp/taxio-apk -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" /tmp/taxio-alert.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch APK and capture crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r /tmp/taxio-alert.apk
            echo 'Third-party packages after install:'
            adb shell pm list packages -3
            adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER be.taxio.alert
            adb logcat -c
            adb shell am force-stop be.taxio.alert || true
            adb shell monkey -p be.taxio.alert -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof be.taxio.alert || true
            adb logcat -d > /tmp/taxio-logcat.txt
            echo '--- fatal/crash lines ---'
            grep -iE 'FATAL EXCEPTION|AndroidRuntime|Process: be.taxio.alert|ReactNativeJS|UnsatisfiedLinkError|ClassNotFoundException|IllegalStateException|NoSuchMethodError|SecurityException' /tmp/taxio-logcat.txt | tail -n 300 || true
            adb shell pidof be.taxio.alert

