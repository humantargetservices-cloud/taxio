name: TAXIO Operator Android Pilot
on:
  push:
    branches: [operator-mobile]
    paths:
      - 'apps/operator/**'
      - 'api/rescue.js'
      - 'scripts/test_operator_accept_guard.mjs'
      - 'scripts/test_operator_notification_guard.mjs'
      - 'scripts/test_operator_booking_state.mjs'
      - '.github/workflows/operator-android-demo.yml'
  workflow_dispatch:

concurrency:
  group: taxio-operator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm live actions remain disabled
        run: |
          if [ "${EXPO_PUBLIC_ENABLE_LIVE_ACTIONS:-false}" = "true" ]; then
            echo 'Live actions cannot be enabled in unverified pilot builds.'
            exit 1
          fi
      - name: Check server acceptance guard
        run: node --test ../../scripts/test_operator_accept_guard.mjs
      - name: Verify notification deduplication
        run: node --test ../../scripts/test_operator_notification_guard.mjs
      - name: Verify booking classification and production isolation
        run: node --experimental-strip-types --test ../../scripts/test_operator_booking_state.mjs
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Verify client-only release policy
        run: |
          if grep -R -n -E 'service_role|SUPABASE_SERVICE_ROLE|EXPO_PUBLIC_ENABLE_LIVE_ACTIONS[[:space:]]*=[[:space:]]*true' src App.tsx; then
            echo 'Disallowed secret or live-action flag found in client source'
            exit 1
          fi
      - name: Check Expo package compatibility
        run: npx expo install --check
      - name: Validate TypeScript
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://staging-not-configured.example
          EXPO_PUBLIC_SUPABASE_ANON_KEY: staging-publishable-key-not-set
        run: npx tsc --noEmit
      - name: Generate Android project
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://staging-not-configured.example
          EXPO_PUBLIC_SUPABASE_ANON_KEY: staging-publishable-key-not-set
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone Android APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://staging-not-configured.example
          EXPO_PUBLIC_SUPABASE_ANON_KEY: staging-publishable-key-not-set
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Upload pilot APK
        uses: actions/upload-artifact@v4
        with:
          name: taxio-operator-pilot-apk
          path: apps/operator/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
