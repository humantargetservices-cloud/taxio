name: TAXIO Operator Android Pilot
on:
  push:
    branches: [operator-mobile]
    paths:
      - 'apps/operator/**'
      - 'api/rescue.js'
      - 'scripts/test_operator_accept_guard.mjs'
      - '.github/workflows/operator-android-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check server acceptance guard
        run: node --test ../../scripts/test_operator_accept_guard.mjs
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://gdiamipqrhxbmrcsnqdk.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_4KLbctN5HvEIt2fjS9UTgA_V2aXzt9k
        run: npx tsc --noEmit
      - name: Generate Android project (production read-only login)
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://gdiamipqrhxbmrcsnqdk.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_4KLbctN5HvEIt2fjS9UTgA_V2aXzt9k
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone Android release APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://gdiamipqrhxbmrcsnqdk.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_4KLbctN5HvEIt2fjS9UTgA_V2aXzt9k
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Upload installable demo APK
        uses: actions/upload-artifact@v4
        with:
          name: taxio-operator-pilot-apk
          path: apps/operator/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
