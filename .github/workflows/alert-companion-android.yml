name: TAXIO Alert Companion Android Pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/alert-companion/**'
      - 'api/_nativeAlert.js'
      - 'api/native-alert-device.js'
      - 'api/native-alert-status.js'
      - 'api/native-alert-poll.js'
      - 'api/native-alert-test.js'
      - 'api/company-push-dispatch.js'
      - 'supabase/migration_native_alert_companion.sql'
      - 'supabase/migration_native_alert_reminders.sql'
      - 'supabase/migration_native_alert_watch_service.sql'
      - '.github/workflows/alert-companion-android.yml'

concurrency:
  group: taxio-alert-companion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/alert-companion
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://gdiamipqrhxbmrcsnqdk.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_4KLbctN5HvEIt2fjS9UTgA_V2aXzt9k
      EXPO_PUBLIC_TAXIO_API_ORIGIN: https://www.taxio.be
      CI: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify root PWA remains isolated
        working-directory: .
        run: |
          test -f package.json
          test -d apps/alert-companion
          node -e "const p=require('./package.json'); if(p.name!=='taxio') process.exit(1)"
          git diff HEAD^ HEAD --name-only | tee /tmp/taxio-alert-files.txt
          if grep -E '^(src/|public/onesignal/|public/sw\.js|vite\.config\.js|vercel\.json|package\.json|package-lock\.json)$' /tmp/taxio-alert-files.txt; then
            echo 'Frozen PWA file changed in alert-companion commit.'
            exit 1
          fi

      - name: Check backend native-alert syntax
        working-directory: .
        run: |
          node --check api/_nativeAlert.js
          node --check api/native-alert-device.js
          node --check api/native-alert-status.js
          node --check api/native-alert-poll.js
          node --check api/native-alert-test.js
          node --check api/company-push-dispatch.js

      - name: Install companion dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Inspect Expo config
        run: npx expo config --type public

      - name: Verify separate companion mobile identity
        run: |
          node -e "const c=require('./app.json').expo; if(c.android.package!=='be.taxio.operator'||c.ios.bundleIdentifier!=='be.taxio.operator'||c.slug!=='taxio-platform'||c.owner!=='taxio-platform') process.exit(1)"
          
      - name: Require separate Firebase registration before native-push APK
        run: |
          if [ ! -f google-services.json ]; then
            echo 'Missing apps/alert-companion/google-services.json for package be.taxio.operator.'
            echo 'Use the existing TAXIO Operator Firebase registration for be.taxio.operator.'
            exit 1
          fi
          grep -q '"package_name": "be.taxio.operator"' google-services.json

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Verify mobile identity and foreground-service wiring
        run: |
          grep -R 'be.taxio.operator' android/app/build.gradle android/app/src/main/AndroidManifest.xml
          grep -R 'FOREGROUND_SERVICE_SPECIAL_USE' android/app/src/main/AndroidManifest.xml
          grep -R 'foregroundServiceType="specialUse"' android/app/src/main/AndroidManifest.xml
          grep -R 'TaxioFirebaseMessagingService' android/app/src/main/AndroidManifest.xml android/app/src/main/java
          grep -R 'TaxioAlertService' android/app/src/main/AndroidManifest.xml android/app/src/main/java
          grep -R 'TaxioWatchService' android/app/src/main/AndroidManifest.xml android/app/src/main/java
          grep -R 'TaxioPagerPackage' android/app/src/main/java
          grep -R 'TaxioOpenPwaReceiver' android/app/src/main/AndroidManifest.xml android/app/src/main/java
          test -f android/app/src/main/res/raw/taxio_offer.wav

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify merged manifest uses TAXIO native pager
        run: |
          MERGED=$(find android/app/build/intermediates -path '*merged*manifest*release*' -name AndroidManifest.xml | head -n 1)
          test -n "$MERGED"
          echo "Merged manifest: $MERGED"
          grep -q 'TaxioFirebaseMessagingService' "$MERGED"
          grep -q 'TaxioAlertService' "$MERGED"
          grep -q 'TaxioWatchService' "$MERGED"
          if grep -q 'expo.modules.notifications.service.ExpoFirebaseMessagingService' "$MERGED"; then
            echo 'Expo FirebaseMessagingService still owns FCM delivery; refusing pager build.'
            exit 1
          fi

      - name: Verify APK exists
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee /tmp/taxio-alert-apk.sha256

      - name: Upload TAXIO Alert APK
        uses: actions/upload-artifact@v4
        with:
          name: taxio-alert-companion-pilot-apk
          path: apps/alert-companion/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: taxio-alert-companion-apk-sha256
          path: /tmp/taxio-alert-apk.sha256
          if-no-files-found: error
          retention-days: 14
